[project]
name = "dreambot"
version = "0.1.0"
description = "A free, open-source, fully local Midjourney alternative for the Mac — powered by MLX, driven from iMessage, Discord, and Telegram."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sako Hartounian" }]
keywords = ["mlx", "image-generation", "apple-silicon", "discord-bot", "telegram-bot", "imessage", "midjourney"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The MLX image engine. Dreambot drives mflux's Python API directly, so the
    # minor version is pinned: adapters are verified against this release line.
    "mflux>=0.24.0,<0.25",
    "pillow>=13.0",
    "pydantic>=2.9,<3",
    "typer>=0.15",
    "rich>=13.0",
    "discord.py>=2.7,<3",
    "python-telegram-bot>=22.0,<23",
    "keyring>=25",
    "tomli-w>=1.0",
    # The vision-language model runtime behind /describe and /shorten.
    "mlx-vlm>=0.7.12",
]

[project.scripts]
dreambot = "dreambot.cli:main"

[tool.uv]
# Dreambot is Mac-only (MLX needs Apple Silicon). Resolving for other platforms would also
# pull in mflux's Linux/CUDA pin of MLX, which conflicts with the Mac packages.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreambot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "mlx: runs real MLX inference with locally cached weights (slow; deselect with -m 'not mlx')",
]
addopts = "-m 'not mlx'"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # prompts legitimately contain en/em dashes (iOS autocorrects "--")
    "RUF002",
    "RUF003",
]
